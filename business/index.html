<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style></head><body>
<title>GoodBite Business</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: fixed menu (left rail on wide screens, bottom bar on phones) + one scrolling work area.
   Single light look on purpose, to keep GoodBite's cream-and-leaf-green identity from the consumer app. */
:root{
  color-scheme:light;
  --bg:#F6F3EA; --panel:#FFFFFF; --panel-2:#FBF9F3; --line:#E4DFD0; --line-2:#CFC9B6;
  --green:#2F7D32; --green-d:#1E5E26; --green-s:#E2F0D6; --green-t:#F1F7EA;
  --ink:#1B2619; --ink-2:#4A5546; --muted:#727A6C;
  --red:#C23A25; --red-s:#FBE5DC; --amber:#9A6A00; --amber-s:#FBEFC8; --blue:#2B5F8A; --blue-s:#E0ECF5; --grey-s:#ECE9DF;
  --display:"Fredoka","Nunito Sans",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(60,50,20,.06),0 4px 14px rgba(60,50,20,.06);
  --side:216px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid #6fb35f;outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.1px}
h1{font-size:26px;line-height:1.2} h2{font-size:18px} h3{font-size:15.5px}
p{margin:0}
a{color:var(--green-d);font-weight:700}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
#app{display:flex;height:100%;min-height:0}
#side{flex:none;width:var(--side);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;font-family:var(--display);font-weight:600;font-size:22px;color:var(--green)}
.logo .lf{font-size:26px;line-height:1}
.logo small{display:block;font-family:var(--body);font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 12px;border-radius:10px;font-weight:700;color:var(--ink-2);width:100%}
.nav:hover{background:var(--green-t)}
.nav.on{background:var(--green);color:#fff}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.nav.on .cnt{background:#fff;color:var(--green-d)}
#side .sp{flex:1}
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);min-height:60px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700}
.crumbs button{color:var(--green-d);font-weight:700;padding:6px 4px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.crumbs b{color:var(--ink)}
.backb{display:flex;align-items:center;gap:4px;padding:0 14px 0 8px;min-height:44px;border-radius:10px;border:1.5px solid var(--line-2);font-weight:800;background:var(--panel)}
.backb:hover{background:var(--green-t)}
.rolebtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--amber-s);font-weight:800;font-size:14px;border:1.5px solid #E8D48E}
.rolebtn span{font-weight:600;color:var(--ink-2)}
.topb{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);font-weight:800;font-size:14px;background:var(--panel)}
.topb:hover{background:var(--green-t)}
#scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pg{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:1180px;margin:0 auto;min-height:100%}
.pg.wide{max-width:none}
#bot{display:none}
.demo-b{background:#FFF1C2;border:1.5px dashed #C89B1B;color:#5C4300;font-weight:800;border-radius:10px;padding:10px 14px;font-size:14px}
.stale{background:var(--blue-s);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700}

/* ---------- page pieces ---------- */
.ph{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ph .t{flex:1;min-width:220px}
.ph .t p{color:var(--muted);margin-top:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:10px;font-weight:800;font-size:15.5px;background:var(--green);color:#fff;border:1.5px solid var(--green);text-align:center;line-height:1.2}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.sec{background:var(--panel);color:var(--green-d);border-color:var(--green)}
.btn.sec:hover{background:var(--green-t)}
.btn.red{background:var(--panel);color:var(--red);border-color:var(--red)}
.btn.red:hover{background:var(--red-s)}
.btn.red.solid{background:var(--red);color:#fff}
.btn.big{min-height:56px;font-size:17px;padding:0 26px}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{background:var(--grey-s);border-color:var(--grey-s);color:var(--muted);cursor:not-allowed}
.why{font-size:13.5px;color:var(--amber);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.pad0{padding:0;overflow:hidden}
.card>h2{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .sm{font-size:13.5px} .b{font-weight:800} .num{font-variant-numeric:tabular-nums}
.r{text-align:right}
.red-t{color:var(--red)} .grn-t{color:var(--green-d)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12.5px;white-space:nowrap;background:var(--grey-s);color:var(--ink-2)}
.pill.ok{background:var(--green-s);color:var(--green-d)} .pill.warn{background:var(--amber-s);color:#6E4B00}
.pill.bad{background:var(--red-s);color:var(--red)} .pill.info{background:var(--blue-s);color:var(--blue)}
.q{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);font-size:12.5px;font-weight:800;color:var(--ink-2);vertical-align:middle;margin-left:4px;position:relative;background:var(--panel)}
.q::after{content:"";position:absolute;inset:-11px}
.q:hover{background:var(--green-t)}

/* home */
.bigacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.biga{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;font-weight:800;font-size:16px;text-align:center}
.biga:hover{border-color:var(--green);background:var(--green-t)}
.biga .rnd{width:68px;height:68px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.biga .rnd svg{width:32px;height:32px}
.alert{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1.5px solid var(--line);font-weight:700}
.alert:hover{border-color:var(--ink-2)}
.alert .ai{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.alert.bad .ai{background:var(--red-s);color:var(--red)} .alert.warn .ai{background:var(--amber-s);color:var(--amber)}
.alert.info .ai{background:var(--blue-s);color:var(--blue)} .alert.ok .ai{background:var(--green-s);color:var(--green-d)}
.alert small{display:block;font-weight:600;color:var(--muted);font-size:13.5px}
.alert .go{margin-left:auto;display:flex;align-items:center;gap:2px;color:var(--green-d);font-weight:800;white-space:nowrap;font-size:14px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);width:100%}
button.kpi:hover{border-color:var(--green);background:var(--green-t)}
.kpi .l{font-size:13px;font-weight:800;color:var(--muted)} .kpi .v{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)} .kpi .s.lnk{color:var(--green-d);font-weight:800}

/* tables & lists */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--panel-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--green-t)}
tr.click td:last-child{white-space:nowrap}
.chev{color:var(--green-d);font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:44px;padding:0 16px;border-radius:999px;font-weight:800;font-size:14.5px;border:1.5px solid var(--line-2);background:var(--panel);color:var(--ink-2)}
.tab:hover{background:var(--green-t)}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.tab .n{opacity:.8;font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line-2);border-radius:10px;padding:0 12px;min-height:46px;color:var(--muted);min-width:0;flex:1;max-width:420px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink);min-height:42px}
.search:focus-within{border-color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:34px 14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-size:17px;font-family:var(--display);font-weight:600}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-weight:800;font-size:13.5px;color:var(--ink-2)}
.inp{background:var(--panel);border:1.5px solid var(--line-2);border-radius:10px;padding:0 12px;min-height:46px;width:100%;outline:0;min-width:0}
textarea.inp{padding:10px 12px;min-height:90px;resize:vertical}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-s)}
.inp.err{border-color:var(--red);background:#FFF8F5}
.inp.narrow{width:110px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.steps .st{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--grey-s)}
.steps .st i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--ink-2);font-size:13px}
.steps .st.on{background:var(--green);color:#fff} .steps .st.on i{color:var(--green-d)}
.steps .st.done{background:var(--green-s);color:var(--green-d)}
.foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1.5px solid var(--line);margin-top:auto;z-index:2}
.foot .rt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.errs{background:var(--red-s);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.errs .e{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700;color:#7A2414}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--panel);font-weight:800;font-size:20px}
.stepper button:hover{background:var(--green-t)}
.stepper button[disabled]{opacity:.4;cursor:not-allowed}
.stepper input{width:76px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-2);font-weight:800;font-size:14.5px;background:var(--panel)}
.chip:hover{background:var(--green-t)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.kv{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted);font-weight:700} .kv dd{margin:0;font-weight:700;word-break:break-word}
.tog{display:flex;align-items:center;gap:12px;min-height:46px;flex:1;min-width:0;font-weight:700}
.tog i{width:50px;height:30px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on i{background:var(--green)} .tog.on i::after{left:23px}

/* success */
.donebox{align-items:center;text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:14px}
.donebox .tick{width:76px;height:76px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.donebox .tick svg{width:40px;height:40px;stroke-width:3}
.donebox .tick.bad{background:var(--red)} .donebox .tick.wait{background:var(--blue)}
.donebox .acts{justify-content:center}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.menug{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.mi{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line);min-height:104px;text-align:left}
.mi:hover{border-color:var(--green);background:var(--green-t)}
.mi .e{font-size:26px;line-height:1} .mi b{font-size:14.5px;line-height:1.2} .mi span{font-weight:800;color:var(--green-d);margin-top:auto;font-variant-numeric:tabular-nums}
.mi small{color:var(--muted);font-size:11.5px;font-weight:700}
.bill{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.bl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border-bottom:0}
.bl small{display:block;color:var(--muted)}
.qb{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--panel);flex:none}
.qb:hover{background:var(--green-t)}
.tot{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.tot.g{font-family:var(--display);font-size:22px;font-weight:600;padding-top:8px;border-top:1.5px solid var(--line)}
.paym{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.paym button{min-height:72px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--panel);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.paym button:hover{background:var(--green-t)}
.paym button.on{background:var(--green);border-color:var(--green);color:#fff}
.billbar{display:none}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;max-width:420px;margin:0 auto;font-family:var(--mono);font-size:13.5px;width:100%;box-shadow:var(--shadow)}
.paper.a4{max-width:760px;font-family:var(--body);font-size:14px}
.paper h3{font-family:var(--body);font-weight:800;text-align:center}
.paper hr{border:0;border-top:1px dashed #999;margin:10px 0}
.paper .l{display:flex;justify-content:space-between;gap:10px}
.qr{width:132px;height:132px;position:relative;flex:none}
.qr svg{width:100%;height:100%;display:block}
.qr span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--red);letter-spacing:1px}
.qr span b{background:#fff;padding:2px 6px;border:2px solid var(--red);border-radius:4px;transform:rotate(-12deg)}
pre.code{background:#1F2A1D;color:#E4F0DA;padding:14px;border-radius:10px;overflow:auto;font-size:12.5px;max-height:50vh;margin:0;font-family:var(--mono);white-space:pre}
textarea.code{width:100%;min-height:240px;font-family:var(--mono);font-size:12.5px;border:1.5px solid var(--line-2);border-radius:10px;padding:10px;background:var(--panel-2)}

/* charts */
.chart{position:relative;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:480px;height:auto}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted);font-weight:700}
.chart .bar{fill:var(--green)} .chart .bar:hover,.chart .bar.h{fill:var(--green-d)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent}
.tipb{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbar i{display:block;height:14px;border-radius:0 4px 4px 0;background:var(--green);min-width:2px}

/* overlays */
#modal{position:fixed;inset:0;background:rgba(27,38,25,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--panel);border-radius:16px;padding:20px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.widem{width:min(820px,100%)}
.mbox .mh{display:flex;align-items:flex-start;gap:10px}
.mbox .mh h2{flex:1;font-size:20px}
.xb{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;border:1.5px solid var(--line-2);flex:none;background:var(--panel)}
.xb:hover{background:var(--green-t)}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line-2);font-weight:700;background:var(--panel)}
.opt:hover{background:var(--green-t)}
.opt.on{border-color:var(--green);background:var(--green-s)}
.opt small{display:block;color:var(--muted);font-weight:600}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:70;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast button{color:#BFE8A8;font-weight:800;text-decoration:underline;min-height:44px;padding:0 6px;white-space:nowrap}
#tour{position:fixed;inset:0;z-index:60;pointer-events:none}
#tour .hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(27,38,25,.6);outline:3px solid #FFD54A;transition:all .2s;pointer-events:none}
#tour .tcard{position:fixed;background:var(--panel);border-radius:14px;padding:16px;width:min(340px,calc(100% - 24px));display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);pointer-events:auto}
#tour .tcard .mf{justify-content:space-between;align-items:center}

<div id="app"><aside id="side" aria-label="Main menu"></aside><div id="main"><header id="top"></header><div id="demo" hidden></div><main id="scr" tabindex="-1"></main></div><nav id="bot" aria-label="Main menu"></nav></div>
<div id="modal" hidden></div><div id="toast" hidden></div><div id="tour" hidden></div>
<script>
const STANDALONE=true;
'use strict';
/* ---------- helpers ---------- */
const KEY='goodbite_b2b_v1';
let S=null,IX=null;
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isoDT=d=>isoD(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const now=()=>new Date();
const today=()=>isoD(now());
const pD=s=>{const[a,b,c]=s.slice(0,10).split('-').map(Number);return new Date(a,b-1,c)};
const pDT=s=>{const d=pD(s);if(s.length>10){const[h,m]=s.slice(11).split(':').map(Number);d.setHours(h,m)}return d};
const addDays=(s,n)=>{const d=pD(s);d.setDate(d.getDate()+n);return isoD(d)};
const dayDiff=(a,b)=>Math.round((pD(a)-pD(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fD=s=>{const d=pD(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const fDs=s=>{const d=pD(s);return d.getDate()+' '+MON[d.getMonth()]};
const fT=s=>{const d=pDT(s),h=d.getHours();return(h%12||12)+':'+pad(d.getMinutes())+(h<12?' am':' pm')};
const fDT=s=>fD(s)+', '+fT(s);
const fM=m=>MONF[+m.slice(5,7)-1]+' '+m.slice(0,4);
const addMonth=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1);return isoD(d).slice(0,7)};
const rm=c=>(c<0?'-':'')+'RM '+(Math.abs(c)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=c=>(c/100).toFixed(2);
const r3=x=>Math.round(x*1000)/1000;
const qf=q=>String(+(+q).toFixed(2));
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+(S.seq.id++);
const fakeId=(R,n)=>{const c='ABCDEFGHJKMNPQRSTVWXYZ0123456789';let o='';for(let i=0;i<n;i++)o+=c[Math.floor(R()*c.length)];return'DEMO'+o.slice(4)};
const plural=(n,w,ws)=>n+' '+(n===1?w:(ws||w+'s'));
const SIM_ERR='LHDN could not match the buyer TIN with the ID number (this rejection is simulated).';

/* ---------- saving ---------- */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&Array.isArray(s.batches))return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function resetDemo(){S=seed();IX=null;sweep();save()}

/* ---------- lookups ---------- */
function ix(){if(!IX||IX.s!==S){IX={s:S,ing:{},menu:{},sup:{}};S.ingredients.forEach(i=>IX.ing[i.id]=i);S.menu.forEach(m=>IX.menu[m.id]=m);S.suppliers.forEach(x=>IX.sup[x.id]=x)}return IX}
const ING=id=>ix().ing[id]||{id,name:'(removed item)',unit:'',cost:0,min:0,kg:0,sup:'',shelf:7,cat:''};
const MENU=id=>ix().menu[id];
const SUP=id=>ix().sup[id]||{id,name:'(no supplier)',lead:1};
const qU=(id,q)=>{const u=ING(id).unit;const w=u==='loaf'?(+q===1?'loaf':'loaves'):u==='piece'?(+q===1?'piece':'pieces'):u;return qf(q)+' '+w};

/* ---------- bill maths (all money is kept in sen so nothing drifts) ---------- */
function billTotals(lines,type,tax){
  tax=tax||S.settings.tax;
  const rate=tax.sstOn?tax.sstRate:0;
  let sub=0,sst=0;
  lines.forEach(l=>{const a=(l.price+(l.modTotal||0))*l.qty;sub+=a;sst+=Math.round(a*rate/100)});
  const sc=(tax.scOn&&(type==='dine'||tax.scTakeaway))?Math.round(sub*tax.scRate/100):0;
  if(tax.sstOnSc)sst+=Math.round(sc*rate/100);
  const raw=sub+sc+sst,total=tax.round5?Math.round(raw/5)*5:raw;
  return{sub,sc,sst,round:total-raw,total};
}
function addDay(sale,sign){const d=sale.dt.slice(0,10),x=S.days[d]||(S.days[d]={bills:0,sub:0,sc:0,sst:0,round:0,total:0,cogs:0,first:sale.no,last:sale.no,ex:{n:0,sub:0,sc:0,sst:0,round:0,total:0}});
  x.bills+=sign;['sub','sc','sst','round','total','cogs'].forEach(k=>x[k]+=sign*sale[k]);if(sign>0){x.first=Math.min(x.first,sale.no);x.last=Math.max(x.last,sale.no)}}
function exDay(sale,sign){const x=S.days[sale.dt.slice(0,10)];if(!x)return;x.ex.n+=sign;['sub','sc','sst','round','total'].forEach(k=>x.ex[k]+=sign*sale[k])}

/* ---------- stock ---------- */
const batchesOf=id=>S.batches.filter(b=>b.ing===id&&b.qty>0.0005).sort((a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:a.recv<b.recv?-1:1);
const onHand=id=>r3(S.batches.reduce((a,b)=>b.ing===id&&b.qty>0.0005?a+b.qty:a,0));
const onOrder=id=>r3(S.orders.reduce((a,o)=>(o.status==='sent'||o.status==='part')?a+o.lines.reduce((x,l)=>l.ing===id?x+Math.max(0,l.qty-l.recv):x,0):a,0));
const daysLeft=b=>dayDiff(b.exp,today());
const isLow=i=>onHand(i.id)<i.min;
const lowList=()=>S.ingredients.filter(isLow);
const soonList=()=>S.batches.filter(b=>b.qty>0.0005&&daysLeft(b)>=0&&daysLeft(b)<=S.settings.expDays).sort((a,b)=>a.exp<b.exp?-1:1);
function consume(id,qty,batchId){const used=[];let need=qty;
  for(const b of batchesOf(id)){if(need<=0.0005)break;if(batchId&&b.id!==batchId)continue;const t=Math.min(b.qty,need);b.qty=r3(b.qty-t);need=r3(need-t);used.push({b:b.id,ing:id,qty:t,cost:Math.round(t*b.cost)})}
  return{used,short:need>0.0005?need:0}}
function giveBack(used){used.forEach(u=>{const b=S.batches.find(x=>x.id===u.b);if(b)b.qty=r3(b.qty+u.qty)})}
function addBatch(ingId,qty,exp,cost,recv){const b={id:'b'+S.seq.batch++,ing:ingId,qty:r3(qty),recv:recv||today(),exp,cost};S.batches.push(b);return b}
function addUse(id,q){const d=today(),u=S.use[d]||(S.use[d]={});u[id]=r3((u[id]||0)+q);const ks=Object.keys(S.use).sort();while(ks.length>21)delete S.use[ks.shift()]}
function avgUse(id){let t=0;for(let d=1;d<=14;d++){const u=S.use[addDays(today(),-d)];if(u&&u[id])t+=u[id]}return t/14}
function logWaste(ingId,qty,reason,o){o=o||{};const i=ING(ingId),r=consume(ingId,qty,o.batch);const got=r3(qty-r.short);if(got<=0.0005)return null;
  const w={id:uid('w'),dt:isoDT(now()),ing:ingId,qty:got,reason,cost:r.used.reduce((a,u)=>a+u.cost,0),kg:r3(got*i.kg),auto:!!o.auto,used:r.used};S.waste.push(w);return w}
function undoWaste(id){const w=S.waste.find(x=>x.id===id);if(!w)return;giveBack(w.used||[]);S.waste=S.waste.filter(x=>x!==w)}
/* anything past its expiry date is moved to the waste log automatically */
function sweep(){let n=0;S.batches.forEach(b=>{if(b.qty>0.0005&&daysLeft(b)<0){S.rescue.forEach(r=>{if(r.batch===b.id&&r.status==='Offered')r.status='Expired before collection'});if(logWaste(b.ing,b.qty,'Expired',{auto:true,batch:b.id}))n++}});if(n)save();return n}
function suggestions(){const out=[];S.ingredients.forEach(i=>{const oh=onHand(i.id),oo=onOrder(i.id),avg=avgUse(i.id),lead=SUP(i.sup).lead;
  const target=Math.max(i.min*2,i.min+avg*(lead+3));
  if(oh+oo<i.min||oh+oo<avg*(lead+1)){let q=target-oh-oo;q=(i.unit==='piece'||i.unit==='loaf'||q>=5)?Math.ceil(q):Math.ceil(q*2)/2;if(q>0)out.push({ing:i.id,qty:q,oh,oo,avg})}});return out}
function adjustStock(id,counted){const oh=onHand(id),diff=r3(counted-oh);if(Math.abs(diff)<0.0005)return 0;
  if(diff<0)consume(id,-diff);else{const i=ING(id),bs=batchesOf(id);if(bs.length)bs[bs.length-1].qty=r3(bs[bs.length-1].qty+diff);else addBatch(id,diff,addDays(today(),i.shelf),i.cost)}
  return diff}

/* ---------- sales ---------- */
function lineRecipe(l){const m=MENU(l.item);if(!m)return[];let rec=m.recipe.map(x=>x.slice());
  (l.mods||[]).forEach(o=>{(o.remove||[]).forEach(g=>rec=rec.filter(x=>x[0]!==g));(o.add||[]).forEach(a=>rec.push(a.slice()))});return rec}
function completeSale(bill,pay,cash){
  const t=billTotals(bill.lines,bill.type);
  const sale={id:uid('s'),no:S.seq.receipt++,dt:isoDT(now()),type:bill.type,table:bill.type==='dine'?bill.table:'',lines:JSON.parse(JSON.stringify(bill.lines)),...t,pay,status:'paid',inv:null,want:false,cogs:0,used:[],short:[],tax:{...S.settings.tax}};
  if(pay==='Cash'){sale.cash=cash;sale.change=cash-t.total}
  sale.lines.forEach(l=>lineRecipe(l).forEach(([g,q])=>{const r=consume(g,q*l.qty);sale.used.push(...r.used);addUse(g,q*l.qty);if(r.short&&!sale.short.includes(g))sale.short.push(g)}));
  sale.cogs=sale.used.reduce((a,u)=>a+u.cost,0);
  S.sales.push(sale);addDay(sale,1);save();return sale}
function voidSale(sale,reason,restock){sale.status='void';sale.voidReason=reason;sale.want=false;addDay(sale,-1);if(restock)giveBack(sale.used);save()}
const lineName=l=>l.name+((l.mods||[]).length?' ('+l.mods.map(o=>o.n).join(', ')+')':'');

/* ---------- e-invoice (simulation only) ---------- */
const invNo=()=>'EINV-'+pad(now().getFullYear()%100)+'-'+String(S.seq.inv++).padStart(5,'0');
function invTotals(inv){const excl=inv.lines.reduce((a,l)=>a+l.amt,0),tax=inv.lines.reduce((a,l)=>a+l.tax,0);inv.tot={excl,tax,incl:excl+tax,round:inv.tot?inv.tot.round:0};inv.tot.payable=inv.tot.incl+inv.tot.round;return inv}
function invFromSale(sale,buyer){const tx=sale.tax||S.settings.tax,rate=tx.sstOn?tx.sstRate:0,tt=tx.sstOn?'02':'06';
  const lines=sale.lines.map(l=>{const a=(l.price+(l.modTotal||0))*l.qty;return{desc:lineName(l),cls:'022',qty:l.qty,unit:l.price+(l.modTotal||0),amt:a,taxType:tt,rate,tax:Math.round(a*rate/100)}});
  if(sale.sc)lines.push({desc:'Service charge ('+tx.scRate+'%)',cls:'022',qty:1,unit:sale.sc,amt:sale.sc,taxType:tx.sstOnSc?tt:'06',rate:tx.sstOnSc?rate:0,tax:tx.sstOnSc?Math.round(sale.sc*rate/100):0});
  return invTotals({id:uid('i'),no:invNo(),type:'01',kind:'single',sales:[sale.id],receipt:sale.no,buyer:buyer||{type:'biz',idType:'BRN',state:'Selangor'},lines,status:'Draft',created:isoDT(now()),tot:{round:sale.round}})}
function consDays(month){return Object.keys(S.days).filter(d=>d.slice(0,7)===month).sort().map(d=>({d,x:S.days[d]})).filter(o=>o.x.bills-o.x.ex.n>0)}
function invConsolidated(month){const tx=S.settings.tax;let rnd=0;
  const lines=consDays(month).map(({d,x})=>{rnd+=x.round-x.ex.round;const a=x.sub+x.sc-x.ex.sub-x.ex.sc;return{desc:'Receipts '+x.first+' to '+x.last+' on '+fD(d)+(x.ex.n?' (leaving out '+plural(x.ex.n,'receipt')+' that got its own e-invoice)':''),cls:'004',qty:1,unit:a,amt:a,taxType:tx.sstOn?'02':'06',rate:tx.sstOn?tx.sstRate:0,tax:x.sst-x.ex.sst,agg:true}});
  return invTotals({id:uid('i'),no:invNo(),type:'01',kind:'consolidated',month,sales:[],buyer:{type:'public',name:'General Public',tin:'EI00000000010',idType:'NA',idNo:'NA',sst:'NA',addr:'NA',city:'NA',post:'',state:'NA',phone:'NA',email:''},lines,status:'Draft',created:isoDT(now()),tot:{round:rnd}})}
function invCreditNote(orig,reason){const lines=orig.lines.map(l=>({...l}));
  return invTotals({id:uid('i'),no:invNo().replace('EINV','CN'),type:'02',kind:'credit',ref:orig.id,refNo:orig.no,refUuid:orig.uuid,sales:orig.sales.slice(),receipt:orig.receipt,buyer:{...orig.buyer},lines,status:'Draft',created:isoDT(now()),reason,tot:{round:orig.tot.round}})}
const TIN_RE=/^[A-Z]{1,2}\d{9,13}$/;
function validateInv(inv){const e=[],b=inv.buyer,c=S.settings.cafe,E=(f,msg,step)=>e.push({f,msg,step});
  if(!c.tin)E('cafe','Your own TIN is missing. Add it in Settings.',0);
  if(!c.msic)E('cafe','Your business activity code is missing. Add it in Settings.',0);
  if(inv.kind!=='consolidated'){
    if(!(b.name||'').trim())E('name','Buyer name is missing.',1);
    if(!(b.tin||'').trim())E('tin','Buyer TIN is missing.',1);else if(!TIN_RE.test(b.tin.trim().toUpperCase()))E('tin','Buyer TIN does not look right. It should be 1 or 2 letters followed by numbers, with no spaces.',1);
    if(!(b.idNo||'').trim())E('idNo','Buyer ID number is missing.',1);
    if(!(b.addr||'').trim())E('addr','Buyer address is missing.',1);
    if(!(b.city||'').trim())E('city','Buyer city is missing.',1);
    if(!(b.phone||'').trim())E('phone','Buyer phone number is missing.',1);else if(!/^\+?\d{8,14}$/.test(b.phone.replace(/[\s-]/g,'')))E('phone','Buyer phone number should be numbers only, for example 0123456789.',1);
    if(b.email&&!/^\S+@\S+\.\S+$/.test(b.email))E('email','Buyer email does not look right. Check for a missing @ or dot.',1);
  }
  if(!inv.lines.length)E('lines','There are no items on this e-invoice.',2);
  const ex=inv.lines.reduce((a,l)=>a+l.amt,0),tx=inv.lines.reduce((a,l)=>a+l.tax,0);
  if(ex!==inv.tot.excl||tx!==inv.tot.tax||ex+tx+inv.tot.round!==inv.tot.payable)E('lines','The totals do not add up. Go back to "Check items" and the app will work them out again.',2);
  if(inv.kind==='single'&&inv.lines.some(l=>!l.agg&&l.tax!==Math.round(l.amt*l.rate/100)))E('lines','A tax amount does not match its tax rate.',2);
  if(inv.type==='02'&&!(inv.reason||'').trim())E('reason','Give a reason for the credit note.',1);
  return e}
/* pretend to send it. Returns the status LHDN "gives back" in this demo. */
function simulateOutcome(inv){return /404$/.test((inv.buyer.tin||'').trim())?'Invalid':'Valid'}
function applyValid(inv){const R=rng(Date.now()%1e9+S.seq.id);inv.status='Valid';inv.validated=isoDT(now());inv.uuid=inv.uuid||fakeId(R,26);inv.longId=fakeId(R,40);inv.errors=[];
  if(inv.kind==='single')inv.sales.forEach(id=>{const s=S.sales.find(x=>x.id===id);if(s){s.inv=inv.id;s.want=false;exDay(s,1)}});
  if(inv.kind==='consolidated')S.cons[inv.month]=inv.id}
function applyInvalid(inv){const R=rng(Date.now()%1e9+7);inv.status='Invalid';inv.uuid=inv.uuid||fakeId(R,26);inv.errors=[SIM_ERR]}
function cancelDeadline(inv){return new Date(pDT(inv.validated).getTime()+S.settings.cancelHours*36e5)}
const canCancel=inv=>inv.status==='Valid'&&now()<cancelDeadline(inv);
function cancelInv(inv,reason){inv.status='Cancelled';inv.cancelReason=reason;inv.cancelled=isoDT(now());
  if(inv.kind==='single')inv.sales.forEach(id=>{const s=S.sales.find(x=>x.id===id);if(s&&s.inv===inv.id){s.inv=null;exDay(s,-1)}});
  if(inv.kind==='consolidated'&&S.cons[inv.month]===inv.id)delete S.cons[inv.month];save()}
const TAXT={'01':'Sales Tax','02':'Service Tax','06':'Not Applicable'};
function invJSON(inv){const c=S.settings.cafe,b=inv.buyer,M=v=>[{_:+amt(v),currencyID:'MYR'}];
  const party=(name,tin,idT,idN,sst,ad,city,post,st,ph,em,msic)=>({Party:[{...(msic?{IndustryClassificationCode:[{_:msic,name:c.activity}]}:{}),PartyIdentification:[{ID:[{_:tin,schemeID:'TIN'}]},{ID:[{_:idN||'NA',schemeID:idT||'BRN'}]},{ID:[{_:sst||'NA',schemeID:'SST'}]}],
    PostalAddress:[{CityName:[{_:city||'NA'}],PostalZone:[{_:post||''}],CountrySubentityCode:[{_:st||'NA'}],AddressLine:[{Line:[{_:ad||'NA'}]}],Country:[{IdentificationCode:[{_:'MYS'}]}]}],PartyLegalEntity:[{RegistrationName:[{_:name}]}],Contact:[{Telephone:[{_:ph||'NA'}],ElectronicMail:[{_:em||''}]}]}]});
  const d=inv.issued||inv.created;
  return{_DEMO:'Simulated document from the GoodBite demo. Not sent to LHDN MyInvois. Not signed. Not a valid tax document.',
   Invoice:[{ID:[{_:inv.no}],IssueDate:[{_:d.slice(0,10)}],IssueTime:[{_:d.slice(11)+':00Z'}],InvoiceTypeCode:[{_:inv.type,listVersionID:'1.1'}],DocumentCurrencyCode:[{_:'MYR'}],
    ...(inv.type==='02'?{BillingReference:[{InvoiceDocumentReference:[{ID:[{_:inv.refNo}],UUID:[{_:inv.refUuid||''}]}]}]}:{}),
    AccountingSupplierParty:[party(c.legal,c.tin,'BRN',c.brn,c.sst,c.addr,c.city,c.post,c.state,c.phone,c.email,c.msic)],

    amount:o.lines.reduce((a,l)=>a+Math.round(l.recv*l.price),0),paid,einv,uuid:einv==='Valid'?fakeId(R,26):''});
  bill(ord('D',16,'received',[['milk',30],['butter',3],['egg',120],['yog',4]]),true,'Valid',-2);
  bill(ord('C',14,'received',[['beans',8],['matcha',0.5],['soda',24]]),true,'Valid',0);
  bill(ord('K',12,'received',[['rice',25],['pasta',8],['oil',10],['tomsauce',6]]),false,'Valid',-3);
  bill(ord('M',6,'received',[['chicken',12],['beef',40],['salmon',2]]),false,'Valid',8);
  bill(ord('P',4,'received',[['lettuce',5],['tomato',8],['banana',6],['avocado',24]]),false,'Not received yet',10);
  ord('B',2,'part',[['sourdough',12],['bun',40],['bagel',24]],0.5);
  ord('P',1,'sent',[['spinach',2],['mushroom',3],['mango',4],['lemon',30],['lettuce',4]]);
  ord('D',9,'cancelled',[['cream',4]]);
  /* e-invoices already in the list */
  const mkInv=(sale,buyer,status,agoH,extra)=>{const inv=invFromSale(sale,{...buyer});inv.status=status;const t=new Date(now()-agoH*36e5);
    inv.issued=isoDT(t);if(status!=='Draft'){inv.uuid=fakeId(R,26);inv.longId=fakeId(R,40)}if(status==='Valid'||status==='Cancelled')inv.validated=isoDT(t);
    Object.assign(inv,extra||{});s.invoices.push(inv);if(status==='Valid'){sale.inv=inv.id;exDay(sale,1)}return inv};
  const old=s.sales.filter(x=>x.dt.slice(0,10)===addDays(T,-2)),yes=s.sales.filter(x=>x.dt.slice(0,10)===addDays(T,-1)),tod=s.sales.filter(x=>x.dt.slice(0,10)===T);
  mkInv(old[3],BUYERS[0],'Valid',100);
  mkInv(yes[yes.length-4],BUYERS[1],'Valid',20);
  mkInv(yes[5],BUYERS[2],'Invalid',22,{errors:[SIM_ERR]});
  mkInv(old[9],BUYERS[1],'Cancelled',52,{cancelReason:'Wrong buyer details',cancelled:isoDT(new Date(now()-50*36e5))});
  [yes[yes.length-2],tod[0],tod[tod.length-1]].forEach(x=>{if(x)x.want=true});
  return s;
}

function barChart(data,o){o=o||{};const W=640,H=o.h||180,L=46,B=22,T=8,max=Math.max(1,...data.map(d=>d.v)),n=data.length;
  const mag=Math.pow(10,Math.floor(Math.log10(max))),step=[1,2,5,10].map(k=>k*mag).find(s=>max/s<=4)||mag*10,top=Math.ceil(max/step)*step;
  const bw=(W-L)/n,w=Math.min(26,Math.max(3,bw-2)),y=v=>T+(H-T-B)*(1-v/top);let g='';
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${o.fmt?o.fmt(v):v}</text>`;
  const every=Math.ceil(n/8);
  data.forEach((d,i)=>{const x=L+i*bw+(bw-w)/2,yy=y(d.v),hh=H-B-yy;
    if(d.v>0)g+=`<path class="bar" d="M${x} ${H-B}V${yy+Math.min(3,hh)}q0-${Math.min(3,hh)} ${Math.min(3,w/2)}-${Math.min(3,hh)}h${w-2*Math.min(3,w/2)}q${Math.min(3,w/2)} 0 ${Math.min(3,w/2)} ${Math.min(3,hh)}V${H-B}z"/>`;
    if(i%every===0)g+=`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${h(d.l)}</text>`;
    g+=`<rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" data-tip="${h(d.t)}"/>`});
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(o.label||'Bar chart')}">${g}</svg><div class="tipb" hidden></div></div>`}

  if(r){const c=r.closest('.chart'),t=c.querySelector('.tipb'),b=c.getBoundingClientRect();t.textContent=r.dataset.tip;t.hidden=false;t.style.left=Math.min(b.width-70,Math.max(70,e.clientX-b.left))+'px';t.style.top=(e.clientY-b.top)+'px'}});
/* a QR-looking picture. It is random dots, not a real code. */
function fakeQR(seedStr){let s=0;for(const c of seedStr)s=(s*31+c.charCodeAt(0))>>>0;const R=rng(s),n=25;let d='';
  const fin=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;if(fin(x,y)){const fx=x<7?x:x-(n-7),fy=y<7?y:y-(n-7);on=fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4)}else on=R()<0.48;if(on)d+=`M${x} ${y}h1v1h-1z`}
  return`<div class="qr" title="Demo picture only. It cannot be scanned."><svg viewBox="-1 -1 ${n+2} ${n+2}" aria-hidden="true"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><path d="${d}" fill="#111"/></svg><span><b>DEMO</b></span></div>`}

/* ---------- Home ---------- */
function alertsFor(role){const a=[],T=today(),k=role==='kitchen',c=role==='cashier',o=role==='owner';
  const add=(cls,icn,t,sub,act,p,goTxt)=>a.push({cls,icn,t,sub,act,p,goTxt});
  if(!c){
    const auto=S.waste.filter(w=>w.auto&&w.dt.slice(0,10)===T);
    if(auto.length)add('bad','trash',plural(auto.length,'item')+' passed the expiry date',''+'Moved to the waste log automatically ('+rm(auto.reduce((x,w)=>x+w.cost,0))+').','root',{s:'waste'},'See waste log');
    const soon=soonList(),ids=[...new Set(soon.map(b=>b.ing))];
    if(soon.length)add('warn','clock',plural(ids.length,'item')+' expiring in '+plural(S.settings.expDays,'day'),ids.slice(0,4).map(i=>ING(i).name).join(', ')+(ids.length>4?' and more':''),'root',{s:'stock',p:{tab:'soon'}},'See the list');
    S.orders.filter(x=>(x.status==='sent'||x.status==='part')&&x.expected<=T).forEach(x=>add('info','truck','Delivery from '+SUP(x.sup).name+' is due'+(x.expected===T?' today':''),'Order #'+x.no+(x.status==='part'?' (part received)':''),'go',{s:'receive',p:{order:x.id,step:1}},'Receive goods'));
    const low=lowList();let shown=0;
    low.forEach(i=>{if(shown>=3)return;const oo=onOrder(i.id);if(oo>0)return;shown++;add('bad','box',i.name+' is low',qU(i.id,onHand(i.id))+' left. Minimum is '+qU(i.id,i.min)+'.','go',{s:'newOrder',p:{ing:i.id}},'Order now')});
    const rest=low.length-shown;if(rest>0)add('warn','box',plural(rest,'more item')+' below minimum stock','Some of them are already on order.','root',{s:'stock',p:{tab:'low'}},'See the list');
  }
  if(o||c){const w=S.sales.filter(x=>x.want&&x.status==='paid'&&!x.inv).length;if(w)add('warn','file',plural(w,'sale')+(w===1?' has':' have')+' no e-invoice yet','The customer asked for an e-invoice.','go',{s:'invoices',p:{f:'wait'}},'Issue them');
    if(c&&S.held.length)add('info','bag',plural(S.held.length,'bill')+' on hold','Open the till to bring a bill back.','root',{s:'pos',p:{openHeld:1}},'Open held bills')}
  if(o){const pm=addMonth(T.slice(0,7),-1);if(!S.cons[pm]&&consDays(pm).length){const due=T.slice(0,7)+'-07';add(T>due?'bad':'warn','file','Combined e-invoice for '+fM(pm)+' walk-in sales is '+(T>due?'overdue':'due by '+fDs(due)),'One e-invoice covers every sale where nobody asked for their own.','go',{s:'invWiz',p:{cons:pm}},'Create it')}
    S.invoices.filter(i=>i.status==='Invalid').forEach(i=>add('bad','alert','E-invoice '+i.no+' was rejected','Fix the buyer details and send it again.','go',{s:'inv',p:{id:i.id}},'Fix it'));
    const od=S.bills.filter(b=>!b.paid&&b.due<T);if(od.length)add('warn','truck',plural(od.length,'supplier bill')+(od.length===1?' is':' are')+' overdue',rm(od.reduce((x,b)=>x+b.amount,0))+' in total.','root',{s:'orders',p:{tab:'bills'}},'See bills')}
  return a}

const bill=()=>S.bill||(S.bill=newBill());

function addLine(m,mods){const b=bill(),mt=mods.reduce((a,o)=>a+o.p,0),sig=JSON.stringify(mods.map(o=>o.n));
  const ex=b.lines.find(l=>l.item===m.id&&JSON.stringify(l.mods.map(o=>o.n))===sig);

SCREENS.notes={sec:'invoices',einv:true,title:()=>'E-invoice notes',help:['This page lists the LHDN rules this demo was built around.','Each point has a link to the official page it came from.','The second list is what could not be confirmed. Treat those as open questions.'],
 html(){return `${pageHead('E-invoice notes','What was checked against official sources on 7 October 2026, and what was not.')}
  <div class="card" style="background:var(--amber-s)"><b>Different from the original brief:</b> small outlets are mostly exempt. A cafe with yearly turnover under RM3 million does not have to issue e-invoices under the current guideline, and one under RM1.5 million does not charge SST. So for GoodBite's target customers, e-invoicing is a "ready when you grow, or when a company customer asks" feature, not a legal must-have today.</div>
  <div class="card"><h2>Checked against official sources</h2><div style="display:flex;flex-direction:column;gap:14px">${NOTES_OK.map(([t,b,s])=>`<div><b>${t}</b><p>${b}</p><p class="sm">Source: ${src(...s)}</p></div>`).join('')}</div></div>
  <div class="card"><h2>Not confirmed</h2><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">${NOTES_NO.map(x=>`<li>${x}</li>`).join('')}</ul><p class="sm" style="margin-top:10px">Also consulted: ${src('t')}</p></div>
  <div class="card"><h2>What a real product would still need</h2><p>Registration with MyInvois for API access, a digital certificate to sign each e-invoice, a real connection that sends the document and reads back LHDN's answer, and secure storage of every e-invoice. None of that exists in this demo.</p><div style="margin-top:10px"><button class="btn sec" ${A('go',{s:'limits'})}>See the full limitations list</button></div></div>`}};

 ['Estimated or made up',['Every price, cost, weight and sales figure. The 2 months of history are generated by the app.','The kilograms per piece or loaf used to turn waste into kg.','Suggested order amounts. They use minimum stock and the last 14 days of use, which is a rough guide.','The tax rates in Settings are common examples, not advice.']],
 ['What a real product would still need',['A server and database, so data is shared between devices and not stuck in one browser.','Real logins and permissions for each staff member.','MyInvois API registration, a digital certificate for signing, and handling of LHDN\'s real replies and errors.','A licensed payment partner for card, DuitNow QR and e-wallets.','Receipt printer, cash drawer and barcode scanner support.','A way to work when the internet is down and sync later.','Checks by an accountant on tax, rounding and e-invoice rules.','Real interviews and testing with cafe owners. This demo has not been tried by one.']]];

Food and drink services are taxed at 6% service tax (they stayed at 6% when the general rate went to 8% on 1 Mar 2024). An outlet only has to register once its yearly sales pass RM1,500,000. On the e-invoice this is tax type 02 (Service Tax). || Perkhidmatan makanan dan minuman dikenakan cukai perkhidmatan 6% (kekal 6% apabila kadar am naik kepada 8% pada 1 Mac 2024). Kedai hanya perlu berdaftar apabila jualan tahunannya melebihi RM1,500,000. Pada e-invois ini ialah jenis cukai 02 (Cukai Perkhidmatan). || 餐饮服务的服务税是 6%（一般税率在 2024 年 3 月 1 日升到 8% 时，餐饮仍是 6%）。店铺年销售额超过 RM1,500,000 才需要注册。在电子发票上这是税种 02（服务税）。
From 1 January 2026 a single sale above RM10,000 cannot go into the combined e-invoice. It needs its own. Rare for a cafe, but it applies to catering orders. || Mulai 1 Januari 2026, satu jualan melebihi RM10,000 tidak boleh dimasukkan ke dalam e-invois gabungan. Ia perlukan e-invois sendiri. Jarang untuk kafe, tetapi terpakai untuk pesanan katering. || 从 2026 年 1 月 1 日起，单笔超过 RM10,000 的销售不能放进合并电子发票，必须单独开。咖啡店很少遇到，但外烩订单适用。
If a customer does not ask for an e-invoice, the outlet gives a normal receipt and sends one consolidated e-invoice within 7 calendar days after the month ends. Buyer name is "General Public", buyer TIN is EI00000000010, and the other buyer details are "NA". Lines can be a list of receipt numbers. Classification code 004 marks a consolidated e-invoice. || Jika pelanggan tidak meminta e-invois, kedai memberi resit biasa dan menghantar satu e-invois disatukan dalam masa 7 hari kalendar selepas bulan berakhir. Nama pembeli ialah "General Public", TIN pembeli ialah EI00000000010, dan butiran pembeli lain ialah "NA". Baris boleh berupa senarai nombor resit. Kod klasifikasi 004 menandakan e-invois disatukan. || 如果顾客没有要求电子发票，店铺给普通收据，并在月底后 7 个日历日内发送一张合并电子发票。买方名称是“General Public”，买方 TIN 是 EI00000000010，其他买方资料填“NA”。明细行可以是收据号码清单。分类代码 004 表示合并电子发票。
LHDN lists 55 data fields needed to issue an e-invoice. This demo fills the main ones and leaves out optional ones such as shipping and customs details. || LHDN menyenaraikan 55 medan data yang diperlukan untuk mengeluarkan e-invois. Demo ini mengisi yang utama dan meninggalkan yang pilihan seperti butiran penghantaran dan kastam. || LHDN 列出开电子发票所需的 55 个数据栏位。这个演示填写主要的栏位，省略运输和报关等可选栏位。
Malaysia has no 1 sen coins, so the final bill is rounded to the nearest 5 sen. || Malaysia tiada syiling 1 sen, jadi bil akhir dibundarkan kepada 5 sen terdekat. || 马来西亚没有 1 仙硬币，所以最后的账单会进位到最接近的 5 仙。
One e-invoice covers every sale where nobody asked for their own. LHDN wants it within 7 days after the month ends. || Satu e-invois merangkumi setiap jualan yang tiada sesiapa meminta e-invois sendiri. LHDN mahukannya dalam masa 7 hari selepas bulan berakhir. || 一张电子发票涵盖所有没人要求单独开发票的销售。LHDN 要求在月底后 7 天内开出。
Puts back the made-up cafe: 44 dishes, 60 ingredients, 6 suppliers and 2 months of sales and waste. Everything you added or changed in this browser is erased. || Mengembalikan kafe rekaan: 44 hidangan, 60 bahan, 6 pembekal dan 2 bulan jualan dan pembaziran. Semua yang anda tambah atau ubah dalam pelayar ini dipadam. || 恢复虚构的咖啡店：44 道菜品、60 种食材、6 家供应商，以及 2 个月的销售和浪费记录。您在这个浏览器里添加或修改的一切都会被清除。

Suggested order amounts. They use minimum stock and the last 14 days of use, which is a rough guide. || Jumlah pesanan cadangan. Ia menggunakan stok minimum dan penggunaan 14 hari lepas, iaitu panduan kasar. || 建议订货量。它用最低库存和过去 14 天的用量来算，只是粗略的参考。
Tap the first "quick fill" buyer, then follow the green button through the 4 steps to Submit. Nothing is sent to LHDN. || Ketik pembeli "isian pantas" yang pertama, kemudian ikut butang hijau melalui 4 langkah hingga Hantar. Tiada apa dihantar ke LHDN. || 点第一个“快速填写”买方，然后跟着绿色按钮走完 4 个步骤到“提交”。不会发送任何东西给 LHDN。
The 5 sen rounding rule was not checked against a Bank Negara source today. It is a switch in Settings. || Peraturan pembundaran 5 sen tidak disemak dengan sumber Bank Negara hari ini. Ia suis dalam Tetapan. || 5 仙进位规则今天没有对照国家银行的来源核实。它是设置里的一个开关。

The LHDN timeline web page still says the exemption is "less than RM1,000,000" (page last updated 7 Dec 2025). The newer guideline PDF says RM3,000,000. This app follows the newer PDF. Ask LHDN or an accountant before relying on either number. || Halaman web garis masa LHDN masih menyatakan pengecualian ialah "kurang daripada RM1,000,000" (halaman dikemas kini kali terakhir pada 7 Dis 2025). PDF garis panduan yang lebih baharu menyatakan RM3,000,000. Aplikasi ini mengikut PDF yang lebih baharu. Tanya LHDN atau akauntan sebelum bergantung pada mana-mana angka. || LHDN 时间表网页仍写豁免门槛是“少于 RM1,000,000”（网页最后更新于 2025 年 12 月 7 日）。较新的指南 PDF 写的是 RM3,000,000。这个应用依照较新的 PDF。采用任何一个数字前，请先问 LHDN 或会计。

The issuer can cancel within 72 hours from the time the e-invoice became valid, and must give a reason. After that the system refuses, so a credit note is needed. || Pengeluar boleh membatalkan dalam masa 72 jam dari masa e-invois menjadi sah, dan mesti memberi sebab. Selepas itu sistem menolak, jadi nota kredit diperlukan. || 开票方可在电子发票生效后 72 小时内取消，而且必须说明原因。之后系统会拒绝，所以需要开贷项通知单。
The phases: over RM100 million turnover from 1 Aug 2024; RM25 to 100 million from 1 Jan 2025; RM5 to 25 million from 1 Jul 2025; up to RM5 million from 1 Jan 2026. The guideline dated 30 Aug 2026 says businesses with yearly turnover below RM3,000,000 are exempt (with exceptions for businesses owned by, or related to, bigger companies). So most small cafes do not have to issue e-invoices today. || Fasa-fasanya: perolehan melebihi RM100 juta mulai 1 Ogos 2024; RM25 hingga 100 juta mulai 1 Jan 2025; RM5 hingga 25 juta mulai 1 Jul 2025; sehingga RM5 juta mulai 1 Jan 2026. Garis panduan bertarikh 30 Ogos 2026 menyatakan perniagaan dengan perolehan tahunan di bawah RM3,000,000 dikecualikan (dengan pengecualian bagi perniagaan yang dimiliki oleh, atau berkaitan dengan, syarikat lebih besar). Jadi kebanyakan kafe kecil tidak perlu mengeluarkan e-invois hari ini. || 各阶段：年营业额超过 RM1 亿的从 2024 年 8 月 1 日开始；RM2500 万到 1 亿的从 2025 年 1 月 1 日；RM500 万到 2500 万的从 2025 年 7 月 1 日；RM500 万以下的从 2026 年 1 月 1 日。2026 年 8 月 30 日的指南说，年营业额低于 RM3,000,000 的商家可豁免（由较大公司拥有或有关联的商家除外）。所以大多数小咖啡店现在不必开电子发票。

What was checked against official sources on 7 October 2026, and what was not. || Apa yang disemak dengan sumber rasmi pada 7 Oktober 2026, dan apa yang tidak. || 2026 年 10 月 7 日对照官方来源核实了哪些，哪些没有。
Worked out from minimum stock and how much was used in the last 14 days. You can change the amounts before sending. || Dikira daripada stok minimum dan jumlah yang digunakan dalam 14 hari lepas. Anda boleh mengubah jumlah sebelum menghantar. || 根据最低库存和过去 14 天的用量算出。发送前可以修改数量。

small outlets are mostly exempt. A cafe with yearly turnover under RM3 million does not have to issue e-invoices under the current guideline, and one under RM1.5 million does not charge SST. So for GoodBite's target customers, e-invoicing is a "ready when you grow, or when a company customer asks" feature, not a legal must-have today. || kedai kecil kebanyakannya dikecualikan. Kafe dengan perolehan tahunan di bawah RM3 juta tidak perlu mengeluarkan e-invois di bawah garis panduan semasa, dan yang di bawah RM1.5 juta tidak mengenakan SST. Jadi bagi pelanggan sasaran GoodBite, e-invois ialah ciri "sedia apabila anda berkembang, atau apabila pelanggan syarikat meminta", bukan kewajipan undang-undang hari ini. || 小店大多可豁免。年营业额低于 RM300 万的咖啡店，按目前的指南不必开电子发票；低于 RM150 万的不收 SST。所以对 GoodBite 的目标客户来说，电子发票是“等您壮大了，或有公司客户要求时就能用”的功能，现在并不是法律上必须的。

function tourDraw(){const el=document.getElementById('tour');if(tourI<0){el.hidden=true;el.innerHTML='';return}const st=TOUR[tourI],t=st.sel(),W=innerWidth,H=innerHeight;
  let hole='',top=H/2-90,left=W/2-170;
  if(t){t.scrollIntoView({block:'nearest'});const r=t.getBoundingClientRect(),pd=6;hole=`<div class="hole" style="left:${r.left-pd}px;top:${r.top-pd}px;width:${r.width+pd*2}px;height:${r.height+pd*2}px"></div>`;
    const cw=Math.min(340,W-24);left=Math.min(W-cw-12,Math.max(12,r.left+r.width/2-cw/2));if(r.width<W*0.4&&r.right+cw+24<W&&r.height>H*0.5){left=r.right+18;top=Math.max(12,r.top+20)}
    else if(r.left>W*0.5&&r.height>H*0.5){left=r.left-cw-18;top=Math.max(12,r.top+20)}
    else top=r.bottom+230<H?r.bottom+16:Math.max(12,r.top-220)}
  el.hidden=false;el.innerHTML=`<div style="position:fixed;inset:0;pointer-events:auto"></div>${hole||'<div style="position:fixed;inset:0;background:rgba(27,38,25,.6)"></div>'}<div class="tcard" role="dialog" aria-modal="true" aria-label="Welcome tour" style="left:${left}px;top:${top}px"><span class="muted sm b">Step ${tourI+1} of ${TOUR.length}</span><h2>${st.t}</h2><p>${st.b}</p><div class="mf"><button class="btn sec sm" ${A('tourEnd')}>Skip the tour</button><div class="row">${tourI?`<button class="btn sec sm" ${A('tourStep',{d:-1})}>Back</button>`:''}<button class="btn" id="tournext" ${A('tourStep',{d:1})}>${tourI===TOUR.length-1?'Finish':'Next'}</button></div></div></div>`;
  const n=document.getElementById('tournext');if(n)n.focus()}

 {t:'A customer asks for an e-invoice',b:'Tap the first "quick fill" buyer, then follow the green button through the 4 steps to Submit. Nothing is sent to LHDN.',sel:'#wiznext',go(){S.role='owner';const s=demoMakeSale();if(s.inv){stack=[{s:'invoices',p:{}},{s:'inv',p:{id:s.inv}}];return}stack=[{s:'invoices',p:{}},{s:'invWiz',p:{sale:s.id}}]}},
 {t:'Statuses and the 72-hour rule',b:'A valid e-invoice can be cancelled for 72 hours. After that the button is locked and you issue a credit note instead. Open an older one from the list to show it.',sel:'#cancelbtn',go(){S.role='owner';const v=S.invoices.filter(i=>i.status==='Valid'&&i.type==='01'&&canCancel(i)).pop();stack=[{s:'invoices',p:{f:'Valid'}}].concat(v?[{s:'inv',p:{id:v.id}}]:[])}},
 {t:'Be honest about what is pretend',b:'Finish here: what was checked against LHDN sources, what was not, and what a real product still needs. End of the demo.',sel:null,go(){S.role='owner';stack=[{s:'settings',p:{}},{s:'notes',p:{}}]}}];
function demoDraw(){const el=document.getElementById('demo');if(!el)return;if(demoI<0){el.hidden=true;el.innerHTML='';return}const st=DEMO[demoI];el.hidden=false;
  el.innerHTML=`<span class="dn">Demo tour · step ${demoI+1} of ${DEMO.length}</span><b>${st.t}</b><span class="sm">${st.b}</span><div class="mf"><button class="btn sec sm" ${A('demoEnd')}>End tour</button><div class="row">${demoI?`<button class="btn sec sm" ${A('demoStep',{d:-1})}>Back</button>`:''}<button class="btn sm" id="demonext" ${A('demoStep',{d:1})}>${demoI===DEMO.length-1?'Finish':'Next'}</button></div></div>`;
  document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));if(st.sel){const t=document.querySelector(st.sel);if(t)t.classList.add('hl')}}
function demoEnd(quiet){if(demoI<0)return;demoI=-1;demoDraw();document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));if(!quiet)toast('Demo tour ended. Start it again from the top bar.')}
function demoGo(){closeModal();DEMO[demoI].go();save();render()}
Object.assign(ACT,{
 demoStart:()=>{closeModal();tourI=-1;tourDraw();S.toured=true;demoI=0;demoGo()},
 demoStep:p=>{demoI+=p.d;if(demoI>=DEMO.length){demoI=DEMO.length-1;demoEnd();return}demoGo()},
 demoEnd:()=>demoEnd()
});

/* ---------- start ---------- */
function boot(){S=load();if(!S){S=seed();sweep();save()}i18nStart();render();if(!S.toured&&!/[?&#]notour/.test(location.href))setTimeout(welcome,250)}
window.GB={reset(role){const _l=curLang();S=seed();S.settings.lang=window.__LANG||'en';sweep();S.toured=true;S.role=role||'owner';closeModal();demoI=-1;tourI=-1;tourDraw();demoSale=null;document.getElementById('toast').hidden=true;stack=[{s:'home',p:{}}];render()},
 key(){const c=cur(),p=c.p||{},k=[c.s,p.tab||'',p.step||'',p.f||'',p.tried?'T':''];
  if(c.s==='pos'){const b=bill();k.push(b.lines.length?'L':'',b.type,p.showBill?'B':'',S.held.length?'H':'')}
  if(c.s==='pay')k.push(p.m,p.cash?'C':'');
  if(c.s==='waste')k.push(p.ing?'I':'',p.reason?'R':'',p.done?'D':'');
  if(c.s==='newOrder')k.push(Object.values(p.qty||{}).some(v=>parseFloat(v)>0)?'Q':'');
  if(c.s==='receive')k.push(p.order?'O':'');
  if(c.s==='invWiz'||c.s==='inv'){const i=S.invoices.find(x=>x.id===(p.inv||p.id));if(i)k.push(i.kind,i.type,i.status,i.buyer&&i.buyer.name?'N':'',canCancel(i)?'cc':'',i.reason?'r':'')}
  if(c.s==='receipt'){const s=saleBy(p.id);if(s)k.push(s.status,s.inv?'i':'',s.want?'w':'')}
  if(c.s==='menuItem'){k.push(p.id?'E':'N',p.d&&p.d.recipe.length?'R':'',p.d&&p.d.add?'A':'',p.d&&p.d.cat==='__new'?'C':'')}
  if(c.s==='bill'){const b=S.bills.find(x=>x.id===p.id);if(b)k.push(b.paid?'p':'',b.einv)}
  if(c.s==='order'){const o=ordBy(p.id);if(o)k.push(o.status)}
  k.push(tourI>=0?'tour'+tourI:'',demoI>=0?'demo'+demoI:'');return k.join('|')},
 info:()=>({screen:cur().s,title:SCREENS[cur().s].title(cur().p),depth:stack.length,modal:!document.getElementById('modal').hidden,role:S.role,p:cur().p}),state:()=>S,go,root,
 fn:{billTotals,onHand,monthStats,validateInv,suggestions,canCancel,invBy:id=>S.invoices.find(i=>i.id===id)}};
boot();
