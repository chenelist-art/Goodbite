<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>GoodBite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-sized column. Cream ground, soft rounded cards, deep leaf green for actions,
   a wooden shelf for the pantry. Single light look on purpose, to match the GoodBite mockup. */
:root{
  color-scheme:light;
  --cream:#FBF5E6; --cream-2:#F4ECD8; --card:#FFFDF8; --line:#EBE2CC;
  --green:#2F7D32; --green-d:#1E5E26; --green-s:#E2F0D6; --green-t:#F0F7E8;
  --ink:#1F2B1D; --muted:#7B8273; --red:#D8452F; --red-s:#FCE4D8; --amber:#EFB52E; --amber-s:#FCF0CC;
  --wood:#C98B4E; --wood-l:#E3AE72; --wood-d:#9A6230; --stage:#E9E2CE;
  --display:"Fredoka","Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --r:18px; --shadow:0 2px 10px rgba(92,70,30,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid #7fb96f;outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.1px}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}

#app{position:relative;width:100%;height:100%;background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
.status{display:none}
@media (min-width:520px) and (min-height:560px){
  #app{width:392px;height:min(830px,calc(100% - 28px));border-radius:46px;border:10px solid #23261f;
    box-shadow:0 24px 60px rgba(60,50,20,.28)}
  .status{display:flex;justify-content:space-between;align-items:center;padding:10px 26px 2px;font-weight:800;font-size:13px;flex:none}
  .status i{display:inline-block;width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
  .status i::after{content:"";position:absolute;inset:1.5px;right:4px;background:var(--ink);border-radius:1px}
}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.pg{padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.pg.flush{padding:0;gap:0}
@keyframes inR{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.a-fwd{animation:inR .22s ease-out} .a-back{animation:inL .22s ease-out} .a-fade{animation:fade .18s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* nav */
#nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 8px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 0;border-radius:12px}
#nav button.on{color:var(--green)}
#nav svg{width:22px;height:22px}
#nav button.on svg{fill:var(--green-s)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* common */
.top{display:flex;align-items:center;gap:10px;min-height:36px}
.top h1{flex:1;min-width:0}
.top.c h1{text-align:center}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ib:active{background:var(--cream-2)}
.ib.sp{visibility:hidden}
.dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--cream)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .sm{font-size:12.5px} .xs{font-size:11.5px} .b{font-weight:800}
.red{color:var(--red)} .grn{color:var(--green)} .ctr{text-align:center}
.sec{display:flex;align-items:center;justify-content:space-between}
.link{color:var(--green);font-weight:800;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;font-weight:800;font-size:15px;
  background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d)}
.btn.soft{background:var(--cream-2);color:var(--ink);box-shadow:none}
.btn.ghost{background:none;color:var(--ink);box-shadow:none}
.btn.danger{background:var(--red-s);color:var(--red);box-shadow:none}
.btn.sm{padding:8px 14px;width:auto;font-size:13px;border-radius:999px;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.tabs{display:flex;background:var(--cream-2);border-radius:999px;padding:3px;gap:2px}
.tabs button{flex:1;padding:8px 6px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--green);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:5px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--green-s);color:var(--green-d);font-weight:800;font-size:11.5px}
.tag.amber{background:var(--amber-s);color:#8a6200} .tag.red{background:var(--red-s);color:var(--red)}
.fe{font-size:34px;line-height:1;filter:drop-shadow(0 3px 2px rgba(60,40,10,.22))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .e{font-size:26px;width:34px;text-align:center;flex:none}
.li .chev{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .fe{font-size:44px}

/* home */
.hello{display:flex;align-items:center;gap:12px}
.ava{width:46px;height:46px;border-radius:50%;background:#F7D9B8;display:grid;place-items:center;font-size:26px;flex:none}
.hello h1{color:var(--green);line-height:1.15}
.alert{display:flex;align-items:center;gap:12px;background:var(--red-s);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.alert b{color:var(--red);font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25}
.alert.ok{background:var(--green-s)} .alert.ok b{color:var(--green-d)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:11.5px}
.quick span{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--green)}
.quick span.fill{background:var(--green);color:#fff}
.quick span.fill2{background:#5DAA4E;color:#fff}
.quick svg{width:26px;height:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--green-t);border-radius:14px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.stat .n{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);font-weight:700}
.stat .i{font-size:22px}
.card .stat{background:var(--card);box-shadow:var(--shadow)}
.prev{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prev button{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.prev b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev small{font-size:10.5px;color:var(--muted);font-weight:700}

.quick.three{grid-template-columns:repeat(3,1fr)}
.quick.three span{width:62px;height:62px;border-radius:50%}
.quick.three svg{width:30px;height:30px;stroke-width:2.4}
.quick.three button{font-size:13px}
.impact{background:var(--green-s);border-radius:var(--r);padding:14px;width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.impact .stat{background:none;padding:2px}
.impact .stat .n{font-size:24px;color:var(--green-d)}
.impact .stat .l{color:var(--ink);font-size:11.5px}
.pg.hasfab{padding-bottom:64px}
#nav{position:relative}
.fab{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:92px;height:41px;flex:none!important;border-radius:92px 92px 0 0!important;
  background:var(--card);border:1px solid var(--line);border-bottom:0;color:var(--green)!important;display:grid!important;place-items:center;padding:8px 0 0!important}
#nav .fab svg{width:30px;height:30px;fill:none}
/* shelf */
.shelf{background:var(--wood-d);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;box-shadow:var(--shadow)}
.cell{position:relative;aspect-ratio:1/.95;border-radius:8px;background:linear-gradient(180deg,#D9A163 0%,var(--wood-l) 55%,#D49A5B 100%);
  border-bottom:9px solid var(--wood);box-shadow:inset 0 6px 10px rgba(90,50,10,.28);display:flex;align-items:center;justify-content:center;color:#fff;min-width:0}
.cell .fe{font-size:44px;margin-top:-10px}
.cell .cq,.cell .cd{position:absolute;left:7px;font-weight:800;text-shadow:0 1px 2px rgba(60,30,0,.6);font-size:11px;line-height:1.1}
.cell .cq{bottom:15px} .cell .cd{bottom:3px}
.cell.soon .cd{color:#FFE9A6} .cell.dead .cd{color:#FFD0C2}
.cell.dead .fe{filter:grayscale(.7) drop-shadow(0 3px 2px rgba(60,40,10,.22))}
.cell.blank{box-shadow:inset 0 6px 10px rgba(90,50,10,.28)}
.cell .rm{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.cell .rm svg{width:12px;height:12px;stroke-width:3.5}

/* scan */
.view{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#6f7f4a,#2f3a22 75%);aspect-ratio:1/1.12;display:grid;place-items:center}
.view.flash{background:radial-gradient(circle at 50% 40%,#b9c98c,#56653a 75%)}
.view .big{font-size:150px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.view .lbl{position:absolute;left:50%;top:38%;transform:translateX(-50%) rotate(-6deg);background:#fff;color:#222;padding:6px 10px;border-radius:6px;font-weight:800;font-size:11px;text-align:center;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.bars{height:26px;margin-top:4px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px,#111 8px 11px,#fff 11px 12px)}
.frame{position:absolute;inset:14% 14% 26%;pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;inset:0;border:4px solid #fff;border-radius:14px;
  clip-path:polygon(0 0,22% 0,22% 4px,78% 4px,78% 0,100% 0,100% 22%,calc(100% - 4px) 22%,calc(100% - 4px) 78%,100% 78%,100% 100%,78% 100%,78% calc(100% - 4px),22% calc(100% - 4px),22% 100%,0 100%,0 78%,4px 78%,4px 22%,0 22%)}
.frame::after{display:none}
.demo{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase}
.scanmsg{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.line{position:absolute;left:14%;right:14%;height:3px;background:#b6f08a;box-shadow:0 0 12px #b6f08a;top:16%;animation:sweep 1.1s ease-in-out infinite alternate}
@keyframes sweep{to{top:72%}}
.camrow{display:flex;justify-content:space-around;align-items:center}
.camrow button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.camrow .rb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.camrow .rb.on{background:var(--amber-s);border-color:var(--amber)}
.shut{width:68px;height:68px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 3px 0 var(--green-d)}
.camrow .shut{justify-content:center}
.shut::after{content:"";width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.9)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-weight:800;font-size:12.5px;color:var(--muted)}
.inp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:0;min-width:0}
.inp:focus{border-color:var(--green)}
textarea.inp{resize:none;min-height:70px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv .inp{width:auto;max-width:170px;padding:8px 10px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.step b{min-width:22px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.hero-food{font-size:120px;line-height:1.1;text-align:center;filter:drop-shadow(0 10px 10px rgba(60,40,10,.2))}
.bar{height:12px;border-radius:999px;background:var(--cream-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--green)}
.bar>i.amber{background:var(--amber)} .bar>i.red{background:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mini .v{font-family:var(--display);font-weight:600;font-size:16px}
.toggle{width:46px;height:28px;border-radius:999px;background:#d6cfbb;position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--green)} .toggle.on::after{left:21px}
.check{width:22px;height:22px;border-radius:6px;border:2px solid #cfc7b0;display:grid;place-items:center;flex:none;color:#fff}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{width:14px;height:14px;stroke-width:3.5}

/* recipes */
.photo{position:relative;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;overflow:hidden}
.photo::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 6px 14px rgba(0,0,0,.15),inset 0 0 0 8px rgba(255,255,255,.6)}
.photo span{position:relative;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.rcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative;text-align:left;width:100%;display:block}
.rcard .photo{height:118px;border-radius:0;font-size:58px}
.rcard .photo::before{width:auto;height:84%}
.rcard .inf{padding:10px 44px 12px 14px}
.heart{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--red);box-shadow:var(--shadow)}
.heart.on svg{fill:var(--red)}
.rcard .heart{right:10px;bottom:10px}
.sug{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sug button{text-align:left;min-width:0}
.sug .photo{aspect-ratio:1;font-size:36px;border-radius:14px}
.sug b{display:block;font-size:12px;margin-top:5px;line-height:1.2}
.rhero{height:190px;border-radius:0;font-size:96px}
.rhero::before{width:auto;height:80%}
.over{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between}
.over .ib{background:var(--card);box-shadow:var(--shadow)}
.stepn{width:26px;height:26px;border-radius:8px;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:13px}

/* rewards / misc */
.pts{font-family:var(--display);font-weight:600;font-size:30px;line-height:1}
.coin{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE28A,#EFB52E);display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 #c98f12}
.logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--green-t);flex:none}
.plan{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:var(--card);position:relative}
.plan.on{border-color:var(--green);background:var(--green-t)}
.plan .v{font-family:var(--display);font-weight:600;font-size:18px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;text-align:left;width:100%}
details{border-bottom:1px solid var(--line);padding:12px 0}
details:last-child{border:0}
summary{font-weight:800;cursor:pointer}
details p{margin-top:8px;color:var(--muted)}

/* sheet + toast */
#sheet{position:absolute;inset:0;background:rgba(40,35,20,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
#sheet .sh{background:var(--cream);border-radius:24px 24px 0 0;padding:20px 18px 22px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
#toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:13.5px;text-align:center;animation:fade .15s;pointer-events:none}
</style>

<div id="app">
  <div class="status" aria-hidden="true"><span>9:41</span><i></i></div>
  <main id="screen"></main>
  <nav id="nav" aria-label="Main"></nav>
  <div id="sheet" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>
<script>
/* ---------- sample catalogue (prices are rough Malaysian supermarket prices, in RM) ---------- */
const FOODS={
  tomato:{n:'Tomato',e:'🍅',c:'Vegetables',p:1.2,co:.15,life:7,u:'piece'},
  banana:{n:'Banana',e:'🍌',c:'Fruits',p:.8,co:.1,life:6,u:'piece'},
  milk:{n:'Milk',e:'🥛',c:'Dairy',p:7.5,co:1.2,life:8,u:'carton'},
  egg:{n:'Eggs',e:'🥚',c:'Dairy',p:.6,co:.3,life:14,u:'piece'},
  carrot:{n:'Carrot',e:'🥕',c:'Vegetables',p:.9,co:.1,life:10,u:'piece'},
  broccoli:{n:'Broccoli',e:'🥦',c:'Vegetables',p:4.5,co:.3,life:7,u:'head'},
  chicken:{n:'Chicken',e:'🍗',c:'Meat',p:9,co:1.8,life:4,u:'pack'},
  lettuce:{n:'Lettuce',e:'🥬',c:'Vegetables',p:3.5,co:.3,life:6,u:'head'},
  onion:{n:'Onion',e:'🧅',c:'Vegetables',p:.7,co:.1,life:21,u:'piece'},
  rice:{n:'Rice',e:'🍚',c:'Pantry',p:14,co:2.5,life:180,u:'bag'},
  cheese:{n:'Cheese',e:'🧀',c:'Dairy',p:8.9,co:1.5,life:14,u:'block'},
  pepper:{n:'Red Capsicum',e:'🫑',c:'Vegetables',p:3.2,co:.2,life:8,u:'piece'},

function useFood(it,qty,label){qty=Math.min(qty,it.qty);const pts=qty*5+(daysLeft(it)<=state.settings.days?5:0);
  state.log.push({t:'used',key:it.key,name:it.name,e:it.e,qty,d:iso(today()),rm:it.price*qty,co:it.co*qty});
  if(label!==false)addPts(pts,label||'Used '+it.name);it.qty-=qty;if(it.qty<=0)dropItem(it);return pts}
function wasteFood(it){if(!it.wasted)state.log.push({t:'wasted',key:it.key,name:it.name,e:it.e,qty:it.qty,d:iso(today()),rm:it.price*it.qty,co:it.co*it.qty});dropItem(it)}
const byId=id=>state.inventory.find(i=>i.id===id);

const expired=()=>sorted().filter(i=>daysLeft(i)<0);
const owned=k=>state.inventory.filter(i=>i.key===k&&daysLeft(i)>=0).sort((a,b)=>daysLeft(a)-daysLeft(b));

function recList(){let l=[...RECIPES];const q=ui.recQ.trim().toLowerCase();

/* ---------- actions ---------- */
const newDraft=(key,o={})=>{const f=FOODS[key]||{};return{key:key||'',name:f.n||o.name||'',e:f.e||'',cat:f.c||'Vegetables',qty:1,expiry:addDays(f.life||5),...o}};
const matchFood=name=>{const n=name.trim().toLowerCase();return Object.keys(FOODS).find(k=>k===n||FOODS[k].n.toLowerCase()===n||FOODS[k].n.toLowerCase()===n+'s'||FOODS[k].n.toLowerCase()+'s'===n)};
const A={
  go(d){const p={...d};delete p.a;delete p.s;delete p.replace;if(d.s==='add'&&!ui.draft.name&&!ui.draft.key)ui.draft=newDraft();go(d.s,p,!!d.replace)},
  tab(d){tab(d.s)},back,
  backTo(d){stack=[{s:'home'},{s:d.s}];render('back')},
  set(d){ui[d.k]=d.v;if(d.k==='recTab')ui.recChip=null;render('keep')},
  addNew(){ui.draft=newDraft();go('add')},
  addNamed(d){ui.draft=newDraft(d.k);go('add')},
  dq(d){ui.draft.qty=Math.max(1,Math.min(99,ui.draft.qty+Number(d.n)));render('keep')},
  saveFood(){const d=ui.draft,name=(d.name||'').trim();
    if(!name)return toast('Please type a food name.');
    if(!d.expiry)return toast('Please pick an expiry date.');
    const key=matchFood(name)||name.toLowerCase().replace(/\s+/g,'-'),f=FOODS[key];
    if(d.id){const it=byId(d.id);if(it)Object.assign(it,{name,key,cat:d.cat,qty:d.qty,expiry:d.expiry,e:f?f.e:(it.key===key?it.e:CAT_EMOJI[d.cat]),wasted:daysLeft({expiry:d.expiry})<0?it.wasted:false});
      save();toast('Changes saved.');return back()}
    const same=state.inventory.find(i=>i.key===key&&i.expiry===d.expiry);
    if(same)same.qty+=d.qty;else state.inventory.push(mkItem(key,d.qty,d.expiry,{name:f?f.n:name,cat:d.cat}));
    save();ui.draft={};ui.invCat='All';ui.invQ='';stack=[{s:'inventory'}];render('fwd');toast(`${f?f.n:name} added to your inventory.`)},
  capture(d){if(ui.scanning)return;ui.scanning=true;render('keep');const mode=ui.scanMode;
    setTimeout(()=>{ui.scanning=false;const k=SCAN[mode][ui.scanIdx[mode]%6];ui.scanIdx[mode]++;ui.draft=newDraft(k);
      if(stack[stack.length-1].s==='scan'){go('scanResult');if(d.src==='gallery')toast('Picked a sample photo from the gallery.')}},1100)},
  flash(){ui.flash=!ui.flash;render('keep')},
  invEdit(){ui.invEdit=!ui.invEdit;render('keep')},
  usedSome(d){const it=byId(d.id);if(!it)return;const pts=useFood(it,1);save();
    if(!byId(d.id)){toast(`All used up! +${pts} points`);back()}else{render('keep');toast(`Nice! +${pts} points`)}},
  addMore(d){const it=byId(d.id);if(!it)return;it.qty++;save();render('keep');toast(`Now ${units(it)}.`)},
  foodMenu(d){const it=byId(d.id);sheet(`<h2>${esc(it.name)}</h2><button class="btn soft" data-a="editFood" data-id="${it.id}">${ic('edit')}Edit details</button><button class="btn danger" data-a="removeAsk" data-id="${it.id}">Remove from inventory</button><button class="btn ghost" data-a="close">Cancel</button>`)},
  editFood(d){const it=byId(d.id);closeSheet();ui.draft={id:it.id,key:it.key,name:it.name,e:it.e,cat:it.cat,qty:it.qty,expiry:it.expiry};go('add')},
  removeAsk(d){const it=byId(d.id);if(!it)return;const dead=daysLeft(it)<0;
    sheet(`<div class="ctr" style="font-size:48px">${it.e}</div><h2 class="ctr">${dead?`${esc(it.name)} has expired`:`What happened to the ${esc(it.name.toLowerCase())}?`}</h2>
      ${dead?`<button class="btn" data-a="rescueForm" data-type="recycle" data-id="${it.id}">Send for Food Recycling</button><button class="btn danger" data-a="removeDo" data-id="${it.id}" data-why="bin">Bin it</button>`
      :`<button class="btn" data-a="removeDo" data-id="${it.id}" data-why="used">I used it all</button><button class="btn danger" data-a="removeDo" data-id="${it.id}" data-why="waste">It went bad</button><button class="btn soft" data-a="removeDo" data-id="${it.id}" data-why="mistake">Added by mistake</button>`}
      <button class="btn ghost" data-a="close">Cancel</button>`)},
  removeDo(d){const it=byId(d.id);if(!it)return;closeSheet();let m=`${it.name} removed.`;
    if(d.why==='used'){m=`Great! +${useFood(it,it.qty)} points`}else if(d.why==='waste'||d.why==='bin'){wasteFood(it);if(d.why==='waste')m=`${it.name} removed and counted as waste.`}else dropItem(it);
    save();if(stack[stack.length-1].s==='food')back();else render('keep');toast(m)},
  close:closeSheet,
  fav(d){const i=state.fav.indexOf(d.id);if(i<0)state.fav.push(d.id);else state.fav.splice(i,1);save();render('keep');toast(i<0?'Saved to your favourites.':'Removed from favourites.')},
  recFav(){ui.recFav=!ui.recFav;render('keep')},
  recChip(d){ui.recChip=ui.recChip===d.k?null:d.k;render('keep')},
  recipesFor(d){ui.recTab='mine';ui.recQ='';ui.recFav=false;ui.recChip=owned(d.k).length?d.k:null;if(!ui.recChip){ui.recTab='popular';ui.recQ=ingName(d.k)}tab('recipes')},
  cookStart(d){ui.cook={step:0};go('cook',{id:d.id})},
  cookStep(d){ui.cook.step+=Number(d.n);render('keep')},
  cookFinish(d){const r=RECIPES.find(x=>x.id===d.id),used=[];let pts=20;
    have(r).forEach(g=>{const it=owned(g.k)[0];used.push(it.name);pts+=useFood(it,1,false)});
    addPts(pts,'Cooked '+r.n);save();ui.cook={used,pts,name:r.n};stack=[{s:'home'}];go('cookDone')},
  redeem(d){const r=REWARDS.find(x=>x.id===d.id);sheet(`<div class="ctr" style="font-size:48px">${r.e}</div><h2 class="ctr">Redeem ${r.d}?</h2><p class="ctr muted sm">${r.n} • This uses ${r.pts} of your ${state.points} points.</p><button class="btn" data-a="redeemDo" data-id="${r.id}">Yes, redeem</button><button class="btn ghost" data-a="close">Not now</button>`)},
  redeemDo(d){const r=REWARDS.find(x=>x.id===d.id);if(state.points<r.pts)return closeSheet();addPts(-r.pts,`Redeemed: ${r.d} (${r.n})`);const code='DEMO-'+uid().slice(0,5).toUpperCase();state.redeemed.push({id:r.id,code,d:iso(today())});save();render('keep');
    sheet(`<div class="ctr" style="font-size:48px">🎉</div><h2 class="ctr">Reward redeemed!</h2><p class="ctr sm muted">${r.d} from ${r.n}</p><div class="card ctr"><div class="xs muted b">Your sample code</div><div class="pts" style="font-size:22px;user-select:all">${code}</div></div><p class="xs muted ctr">Demo only. This code can't be used in a real shop.</p><button class="btn" data-a="close">Done</button>`)},
  rescueForm(d){closeSheet();ui.rdraft={type:d.type,sel:d.id?{[d.id]:true}:{},other:'',area:AREAS[0],date:addDays(1),slot:SLOTS[0],note:''};
    if(d.type==='recycle'&&!d.id)expired().forEach(i=>ui.rdraft.sel[i.id]=true);go('rescueForm')},
  rsel(d){ui.rdraft.sel[d.id]=!ui.rdraft.sel[d.id];render('keep')},
  rescueSend(){const d=ui.rdraft,items=state.inventory.filter(i=>d.sel[i.id]);
    if(!items.length&&!d.other.trim())return toast('Tell us what food you have first.');
    if(!d.date||d.date<iso(today()))return toast('Please pick a pickup date from today onwards.');
    const summary=[...items.map(i=>`${i.name} x${i.qty}`),d.other.trim()].filter(Boolean).join(', ');
    items.forEach(i=>{if(d.type==='donate')useFood(i,i.qty,false);else wasteFood(i)});
    const r={id:uid(),ref:'GB-'+uid().slice(0,5).toUpperCase(),type:d.type,summary,area:d.area,date:d.date,slot:d.slot,partner:PARTNERS[d.type]};
    state.rescue.unshift(r);addPts(20,d.type==='donate'?'Food donation requested':'Food recycling requested');save();go('rescueDone',{id:r.id},true);toast('+20 points for rescuing food')},
  upgradeAsk(){sheet(`<div class="ctr" style="font-size:48px">👑</div><h2 class="ctr">Start GoodBite Premium?</h2><p class="ctr muted sm">${ui.plan==='yearly'?'Yearly plan, RM 89.00 per year':'Monthly plan, RM 9.90 per month'}</p><div class="card ctr sm" style="background:var(--amber-s)"><b>Demo only.</b> No payment details are needed and nothing is charged.</div><button class="btn" data-a="upgradeDo">Confirm demo upgrade</button><button class="btn ghost" data-a="close">Cancel</button>`)},
  upgradeDo(){state.user.plan=ui.plan;save();render('keep');sheet(`<div class="ctr" style="font-size:48px">🎉</div><h2 class="ctr">Welcome to Premium!</h2><p class="ctr muted sm">This is a demo confirmation. No payment was taken.</p><button class="btn" data-a="close">Done</button>`)},
  downgrade(){state.user.plan=null;save();render('keep');toast('You are back on GoodBite Free.')},
  notifToggle(){state.settings.notif=!state.settings.notif;save();render('keep')},
  resetAsk(){sheet(`<h2 class="ctr">Reset to sample data?</h2><p class="ctr muted sm">This removes everything you've added on this device and brings back the sample groceries, points and history.</p><button class="btn danger" data-a="resetDo">Yes, reset</button><button class="btn ghost" data-a="close">Cancel</button>`)},
  resetDo(){state=seed();save();closeSheet();Object.assign(ui,{invCat:'All',invEdit:false,invQ:'',homeQ:'',recTab:'mine',recChip:null,recQ:'',recFav:false,draft:{}});tab('home');toast('Sample data restored.')},
  logoutAsk(){sheet(`<h2 class="ctr">Log out of GoodBite?</h2><p class="ctr muted sm">Your food list stays saved on this device.</p><button class="btn danger" data-a="logoutDo">Log Out</button><button class="btn ghost" data-a="close">Stay</button>`)},
  logoutDo(){closeSheet();state.loggedOut=true;save();render()},
  login(){state.loggedOut=false;save();tab('home');toast(`Welcome back, ${state.user.name}!`)},
  copyMail(){const t='hello@goodbite.example',sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('help-mail'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Address selected. Copy it from here.')};
    try{navigator.clipboard.writeText(t).then(()=>toast('Email address copied.'),sel)}catch(e){sel()}}
};
const Q={home(v){ui.homeQ=v;document.getElementById('homeBody').innerHTML=homeBody()},inv(v){ui.invQ=v;document.getElementById('invGrid').innerHTML=shelf()},rec(v){ui.recQ=v;document.getElementById('recList').innerHTML=recList()}};
const OBJ={draft:()=>ui.draft,rdraft:()=>ui.rdraft,user:()=>state.user,settings:()=>state.settings};

document.getElementById('app').addEventListener('click',e=>{
  if(e.target===sheetEl)return closeSheet();
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(fn)fn({...el.dataset},el)});
document.getElementById('app').addEventListener('input',e=>{const el=e.target;
  if(el.dataset.q)return Q[el.dataset.q](el.value);
  if(el.dataset.bind){const o=OBJ[el.dataset.obj||'draft'](),k=el.dataset.bind;o[k]=k==='days'?Number(el.value):el.value;
    if(el.dataset.obj==='user'||el.dataset.obj==='settings')save()}});
document.getElementById('app').addEventListener('change',e=>{const el=e.target;
  if(el.dataset.bind==='name'&&!el.dataset.obj){const k=matchFood(el.value);if(k&&!ui.draft.id){const f=FOODS[k];Object.assign(ui.draft,{key:k,e:f.e,cat:f.c,expiry:addDays(f.life)});render('keep')}}
  if(el.dataset.obj==='user'&&!el.value.trim()){state.user[el.dataset.bind]=el.dataset.bind==='name'?'Friend':'';save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheetEl.hidden)closeSheet()});
render();
</script>
</body></html>
